---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: libvirtmachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    kind: LibvirtMachine
    listKind: LibvirtMachineList
    plural: libvirtmachines
    singular: libvirtmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster this LibvirtMachine belongs to
      jsonPath: .metadata.labels['cluster\.x-k8s\.io/cluster-name']
      name: Cluster
      type: string
    - description: Domain was created
      jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - description: Domain state on the libvirt host
      jsonPath: .status.conditions[?(@.type=="DomainRunning")].reason
      name: State
      type: string
    - description: Domain IP address
      jsonPath: .status.addresses[0].address
      name: Address
      type: string
    - description: Provider ID of the machine
      jsonPath: .spec.providerID
      name: ProviderID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LibvirtMachine is the Schema for the libvirtmachines API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of LibvirtMachine
            properties:
              diskGiB:
                default: 20
                description: DiskGiB is Domain disk size in GiB
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: diskGiB is immutable
                  rule: self == oldSelf
              image:
                description: Image is the name of the base image volume in the LibvirtCluster
                  basePool
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: image is immutable
                  rule: self == oldSelf
              memoryMiB:
                default: 1024
                description: MemoryMiB is Domain memory in MiB
                format: int32
                minimum: 256
                type: integer
                x-kubernetes-validations:
                - message: memoryMiB is immutable
                  rule: self == oldSelf
              providerID:
                description: |-
                  ProviderID is the unique identifier for the machine, set by the controller
                  Example: libvirt://3f1c0a52-6b3e-4c51-9a0e-8d7f4e2b1c90
                type: string
                x-kubernetes-validations:
                - message: providerID is immutable once set
                  rule: self == oldSelf
              vcpu:
                default: 1
                description: VCPU is the number of virtual CPUs
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: vcpu is immutable
                  rule: self == oldSelf
            required:
            - image
            type: object
          status:
            description: status defines the observed state of LibvirtMachine
            properties:
              addresses:
                description: Addresses contains machine IP addresses.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: Conditions represent the latest available observations
                  of the LibvirtMachine state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              initialization:
                properties:
                  provisioned:
                    type: boolean
                type: object
              ready:
                description: Ready indicates the Domain infrastructure is ready.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
