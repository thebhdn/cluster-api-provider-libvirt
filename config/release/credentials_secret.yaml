# Controller-wide libvirt credentials, used by LibvirtClusters without spec.credentialsRef.
# clusterctl fills it from base64 env vars at `clusterctl init`; all empty means a plain connection.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-api-provider-libvirt-credentials
  namespace: cluster-api-provider-libvirt-system
type: Opaque
data:
  ca.crt: ${LIBVIRT_TLS_CA_B64:=""}
  tls.crt: ${LIBVIRT_TLS_CERT_B64:=""}
  tls.key: ${LIBVIRT_TLS_KEY_B64:=""}
  ssh-privatekey: ${LIBVIRT_SSH_PRIVATE_KEY_B64:=""}
  known_hosts: ${LIBVIRT_SSH_KNOWN_HOSTS_B64:=""}
