apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - ${POD_CIDR:=10.244.0.0/16}
    services:
      cidrBlocks:
        - ${SERVICE_CIDR:=10.96.0.0/12}
    serviceDomain: cluster.local
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: ${CLUSTER_NAME}-control-plane
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: LibvirtCluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: LibvirtCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: ${NAMESPACE}
spec:
  uri: ${LIBVIRT_URI}
  network: ${LIBVIRT_NETWORK:=default}
  basePool: ${LIBVIRT_BASE_POOL}
  domainPool: ${LIBVIRT_DOMAIN_POOL}
  controlPlaneEndpoint:
    host: ${CONTROL_PLANE_ENDPOINT_IP}
    port: 6443
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: LibvirtMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      vcpu: ${CONTROL_PLANE_MACHINE_VCPU:=2}
      memoryMiB: ${CONTROL_PLANE_MACHINE_MEMORY_MIB:=4096}
      diskGiB: ${CONTROL_PLANE_MACHINE_DISK_GIB:=20}
      image: ${LIBVIRT_IMAGE}
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: ${NAMESPACE}
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT}
  version: ${KUBERNETES_VERSION}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: LibvirtMachineTemplate
        name: ${CLUSTER_NAME}-control-plane
  kubeadmConfigSpec:
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: provider-id
            value: "libvirt://{{ ds.meta_data.instance_id }}"
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          - name: provider-id
            value: "libvirt://{{ ds.meta_data.instance_id }}"
    # kube-vip needs super-admin.conf until kubeadm init finishes (Kubernetes 1.29+).
    preKubeadmCommands:
      - "if [ -f /run/kubeadm/kubeadm.yaml ]; then sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml; fi"
    postKubeadmCommands:
      - "if [ -f /run/kubeadm/kubeadm.yaml ]; then sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml; fi"
    files:
      - path: /etc/kubernetes/manifests/kube-vip.yaml
        owner: root:root
        permissions: "0644"
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: kube-vip
            namespace: kube-system
          spec:
            containers:
              - name: kube-vip
                image: ghcr.io/kube-vip/kube-vip:${KUBE_VIP_VERSION:=v1.3.1}
                imagePullPolicy: IfNotPresent
                args:
                  - manager
                env:
                  - name: cp_enable
                    value: "true"
                  - name: vip_interface
                    value: ${KUBE_VIP_INTERFACE:=ens3}
                  - name: address
                    value: ${CONTROL_PLANE_ENDPOINT_IP}
                  - name: port
                    value: "6443"
                  - name: vip_arp
                    value: "true"
                  - name: vip_leaderelection
                    value: "true"
                  - name: vip_leaseduration
                    value: "15"
                  - name: vip_renewdeadline
                    value: "10"
                  - name: vip_retryperiod
                    value: "2"
                securityContext:
                  capabilities:
                    add:
                      - NET_ADMIN
                      - NET_RAW
                volumeMounts:
                  - name: kubeconfig
                    mountPath: /etc/kubernetes/admin.conf
            hostAliases:
              - hostnames:
                  - kubernetes
                ip: 127.0.0.1
            hostNetwork: true
            volumes:
              - name: kubeconfig
                hostPath:
                  path: /etc/kubernetes/admin.conf
                  type: FileOrCreate
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: LibvirtMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      vcpu: ${WORKER_MACHINE_VCPU:=2}
      memoryMiB: ${WORKER_MACHINE_MEMORY_MIB:=4096}
      diskGiB: ${WORKER_MACHINE_DISK_GIB:=20}
      image: ${LIBVIRT_IMAGE}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            - name: provider-id
              value: "libvirt://{{ ds.meta_data.instance_id }}"
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: ${NAMESPACE}
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: ${CLUSTER_NAME}-md-0
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: LibvirtMachineTemplate
        name: ${CLUSTER_NAME}-md-0
