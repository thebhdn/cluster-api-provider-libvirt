version: "2"
run:
  allow-parallel-runners: true
  # Also lint the e2e suite.
  build-tags:
    - e2e
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    errcheck:
      # Deferred Free and Close only drop a libvirt reference; the caller cannot act on an error.
      exclude-functions:
        - (*libvirt.org/go/libvirt.Connect).Close
        - (*libvirt.org/go/libvirt.Domain).Free
        - (*libvirt.org/go/libvirt.Network).Free
        - (*libvirt.org/go/libvirt.StoragePool).Free
        - (*libvirt.org/go/libvirt.StorageVol).Free
        - (*libvirt.org/go/libvirt.Stream).Free
    staticcheck:
      checks:
        - all
        - "-QF1008"
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
