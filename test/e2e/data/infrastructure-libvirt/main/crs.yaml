# The e2e suite puts the CNI manifest from the CNI variable in place of ${CNI_RESOURCES}.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cni-${CLUSTER_NAME}-crs-0
  namespace: ${NAMESPACE}
data: ${CNI_RESOURCES}
---
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: ${CLUSTER_NAME}-crs-0
  namespace: ${NAMESPACE}
spec:
  strategy: ApplyOnce
  clusterSelector:
    matchLabels:
      cni: ${CLUSTER_NAME}-crs-0
  resources:
  - name: cni-${CLUSTER_NAME}-crs-0
    kind: ConfigMap
